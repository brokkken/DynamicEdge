name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build and package
        shell: pwsh
        run: ./build/package.ps1 -Version "1.0.${{ github.run_number }}.0"
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicEdge-Setup
          path: artifacts/DynamicEdge-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicEdge-MSIX
          path: |
            artifacts/DynamicEdge.msix
            artifacts/DynamicEdge.cer
            artifacts/install.ps1
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DynamicEdge-Setup.exe
            artifacts/DynamicEdge.msix
            artifacts/DynamicEdge.cer
            artifacts/install.ps1
